[package]
name = "tachylite"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A fast, offline-first, read-only web viewer for Obsidian-style Markdown vaults."
license = "MIT OR Apache-2.0"
repository = "https://github.com/olliegilbey/tachylite"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
comrak = { version = "0.59.0", default-features = false }
futures-util = { version = "0.3.34", default-features = false }
glob = "0.3.4"
rustix = { version = "1.1.6", features = ["fs"] }
tokio = { version = "1.54.1", features = ["rt", "net", "sync"] }
toml = { version = "1.2.0", default-features = false, features = ["std", "parse"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
rustix = { version = "1.1.6", features = ["fs", "process"] }
tempfile = "3.27.0"
