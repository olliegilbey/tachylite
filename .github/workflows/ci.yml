name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete,cargo-deny
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - run: make check PLAYWRIGHT_INSTALL=--with-deps
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: browser/test-results/
          if-no-files-found: ignore

  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: make size TARGET=${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: tachylite-${{ matrix.arch }}-linux
          path: target/${{ matrix.target }}/release/tachylite
          retention-days: 3

  # A pushed v* tag publishes the two binaries, once the gate and both builds pass.
  publish:
    if: github.ref_type == 'tag'
    needs: [check, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - run: grep -qx "version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml
      - uses: actions/download-artifact@v8
        with:
          pattern: tachylite-*-linux
          path: bin
      - run: |
          for arch in x86_64 aarch64; do mv bin/tachylite-$arch-linux/tachylite tachylite-$arch-linux; done
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes tachylite-*-linux
